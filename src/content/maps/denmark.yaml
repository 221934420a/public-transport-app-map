id: denmark
country_code: DK
title: Public transport apps
eyebrow: Denmark
page_title: Public Transport App Map | Denmark
meta_description: Which public transport apps work where, across Denmark.
theme_color: '#fef7ff'
locale: da-DK
map_aria_label: Denmark public transport map

view:
  style_url: https://tiles.openfreemap.org/styles/positron
  center: [10.3, 55.9]
  zoom: 6.8
  max_pitch: 0
  drag_rotate: false

# Default theme for the map chrome, taken from the Rejsebillet app icon. Each
# app's service area can switch the accent to its own colours when selected.
theme:
  accent: '#094507'
  accent_strong: '#052b04'
  outline: '#094507'
  marker_border: '#1d1b20'

# Areas without their own style use this. Rejsebillet's nationwide area, the
# City Pass X-Large outline and the four City Pass areas each carry a style.
overview:
  fill_opacity: 0.43
  outline_width: 2.5

