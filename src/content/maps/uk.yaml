id: uk
title: Public transport apps
eyebrow: United Kingdom
page_title: Public Transport App Map | United Kingdom
meta_description: Which public transport apps work where, across the United Kingdom.
theme_color: '#fef7ff'
locale: en-GB
featured: true
map_aria_label: United Kingdom public transport map

view:
  style_url: https://tiles.openfreemap.org/styles/positron
  center: [-2.6, 53.5]
  zoom: 8
  max_pitch: 0
