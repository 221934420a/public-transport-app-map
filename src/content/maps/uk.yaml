  close_label: Close information panel
  marker_action_label: View {app} coverage
  website_link_label: '{app} official website'
  description_fallback: Ticket and coverage information for {app}.
  ticket_source_label: View ticket source
  coverage_source_label: View service area source
  ticket_meta: '{passenger} · {duration}'
  from_price: From {price}
  view_fares: View fares
  zoom_in_label: Zoom in
  zoom_out_label: Zoom out
  map_controls_label: Map controls
