notes: >-
  The mapped service area is the official boundary of Trnava, the city the MHD
  network serves, so the shaded shape follows the municipal boundary rather than
  a stop-density approximation. Ubian is a shared platform, so this record shows
  the Trnava front end and shares the Ubian app and icon with the Košice and
  Prešov records. The icon is the official Ubian app icon from Google Play,
  stored as public/icons/ubian.png.
