notes: >-
  The mapped service area is the official Banskobystrický kraj boundary, the
  region the IDS BBSK integrated system coordinates, so the shaded shape follows
  the regional boundary rather than a stop-density approximation. The municipal
  MHD Banská Bystrica app handles city SMS tickets while the IDS BBSK e-shop
  sells passes; the regional mobile app is still listed as in preparation, so
  the record links the municipal app. The icon is the official MHD Banská
  Bystrica + IDS BBSK app icon from Google Play, stored as
  public/icons/bbsk.png.
