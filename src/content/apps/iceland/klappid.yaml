notes: >-
  The mapped service area is the official Greater Reykjavík capital-region
  boundary (Höfuðborgarsvæðið), the area served by Strætó routes 1-36, so the
  shaded shape matches the zone the app sells tickets for. Klappið is published
  by Strætó bs but is only distributed through the App Store, so its icon comes
  from the official App Store listing and is stored as public/icons/klappid.png.
