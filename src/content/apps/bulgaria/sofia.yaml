notes: >-
  The mapped service area is the official Столична община boundary, the
  municipality the urban mobility centre covers, so the shaded shape follows the
  municipal boundary rather than a stop-density approximation. The app issues a
  virtual Sofia City Card into Google Wallet and sells single, 24 and 72 hour,
  monthly and annual fares, plus Pay-As-You-Go contactless with a daily cap. The
  icon is the official Sofia2Go app icon from Google Play, stored as
  public/icons/sofia.png.
