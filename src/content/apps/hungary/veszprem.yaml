notes: >-
  This is the local ticket scope of Közlekedési Mobiljegy, the national platform
  run by Nemzeti Mobilfizetési Zrt. that the city operator uses for app sales,
  so the mapped area is the official municipal boundary. It shares the Mobiljegy
  app and icon with the other city scopes because it is the same app with a
  different ticket scope. The icon is the official Közlekedési Mobiljegy app
  icon from Google Play, stored as public/icons/mobiljegy.png.
