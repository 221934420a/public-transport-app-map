notes: >-
  The mapped service area is the official boundary of Debrecen, the city DKV
  serves, so the shaded shape follows the municipal boundary rather than a
  stop-density approximation. Debrecen's tickets are also sold through the
  national Közlekedési Mobiljegy platform, but DKV publishes its own MyDKV app,
  so this record uses that app and its own icon, stored as public/icons/mydkv.png.
