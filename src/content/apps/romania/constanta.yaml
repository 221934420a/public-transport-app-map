notes: >-
  The mapped service area is the official boundary of Constanța, the city CTBUS
  serves, so the shaded shape follows the municipal boundary rather than a
  stop-density approximation. CTBUS became a regional operator in November 2026,
  adding four metropolitan routes, which will extend beyond this boundary. The
  icon is the official CT Bus app icon from Google Play, stored as
  public/icons/constanta.png.
