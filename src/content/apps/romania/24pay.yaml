notes: >-
  24pay is a commercial wallet rather than a city operator, covering the local
  networks of Brașov, Sibiu, Ploiești, Iași, Galați, Constanța and Craiova, so
  the mapped area is the union of those official city boundaries rather than a
  single municipal shape. Tickets sold through it are single, day and monthly
  fares for each network. The icon is the official 24pay app icon from Google
  Play, stored as public/icons/24pay.png.
