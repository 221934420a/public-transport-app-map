notes: >-
  The mapped service area is the union of the official Bucharest and Ilfov
  county boundaries, the metropolitan area STB serves on the surface, so the
  shaded shape follows the administrative boundaries rather than a stop-density
  approximation. The app does not sell metro tickets, which are handled
  separately by Metrorex. The icon is the official Bilet TB app icon from Google
  Play, stored as public/icons/bucuresti.png.
