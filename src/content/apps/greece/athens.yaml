notes: >-
  The mapped service area is the official Δήμος Αθηναίων boundary, the core of
  the Athens fare zone, so the shaded shape follows the municipal boundary
  rather than a stop-density approximation; OASA services and the same fare zone
  extend across the wider urban area beyond this shape. The app loads tickets
  onto the ATH.ENA card over NFC and also supports Tap2Ride contactless payment
  with a daily cap, and it is Android-only because it needs NFC. The icon is the
  official ATH.ENA Card app icon from Google Play, stored as
  public/icons/athens.png.
