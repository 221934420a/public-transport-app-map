notes: >-
  Pilet.ee is the joint Ridango ticketing platform run for Tallinn and the
  county public-transport centres, selling tickets for Tallinn, Harjumaa, Tartu,
  Pärnu, Narva, Kohtla-Järve, Rakvere, Läänemaa, Lääne-Virumaa and ten counties
  of county-line buses, so the mapped area is the national boundary of Estonia.
  This record is the whole system; the same system also has per-city entry
  points (tallinn.pilet.ee, tartu.pilet.ee, parnu.pilet.ee, iil.pilet.ee) with
  narrower ticket scopes, which are listed separately. The icon is the official
  Pilet.ee app icon from Google Play, stored as public/icons/pilet.png, and is
  shared by those entry points because it is one app.
