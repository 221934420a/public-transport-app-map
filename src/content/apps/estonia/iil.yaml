notes: >-
  This is the iil.pilet.ee entry point run by the Harjumaa, Läänemaa and
  Lääne-Virumaa county public-transport centre, so the mapped area is the union
  of the official Lääne maakond and Lääne-Viru maakond boundaries plus Harjumaa,
  which is also the Tallinn entry point scope. It shares the Pilet.ee app and
  icon with the parent record because it is the same app with a narrower ticket
  scope.
