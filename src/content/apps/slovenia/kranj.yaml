notes: >-
  The mapped service area is the official boundary of Kranj, the city the
  network serves, so the shaded shape follows the municipal boundary rather than
  a stop-density approximation. Kranj takes contactless payment through the CeKR
  city card and bank cards, but whether the Pametni Kranj app itself sells bus
  tickets could not be confirmed, so this record should be treated as
  provisional. The icon is the official Pametni Kranj (CeKR) app icon from
  Google Play, stored as public/icons/kranj.png.
