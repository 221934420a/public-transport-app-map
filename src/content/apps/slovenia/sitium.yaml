notes: >-
  The mapped service area is the official boundary of Novo mesto, the city the
  network serves, so the shaded shape follows the municipal boundary rather than
  a stop-density approximation. From 1 March 2026 the city routes accept only
  SITIUM tickets, so IJPP tickets are no longer valid there. The icon is the
  official SITIUM app icon from Google Play, stored as public/icons/sitium.png.
