notes: >-
  The mapped service area is the official boundary of the City of Zagreb, the
  area ZET serves, so the shaded shape follows the municipal boundary rather
  than a stop-density approximation. The app sells singles, 24 and 72 hour day
  tickets and monthly and annual passes, and also handles the joint ZET-HŽPP
  ticket. The icon is the official Moj ZET app icon from Google Play, stored as
  public/icons/zagreb.png.
