notes: >-
  The mapped service area is the official boundary of Rijeka, the city
  Autotrolej serves, so the shaded shape follows the municipal boundary rather
  than a stop-density approximation. Digital tickets went live on 1 April 2026
  and are valid across the whole fare area, activated before boarding, while day
  and week tickets are still bought at ticket booths. The icon is the official
  RCC Mobility app icon from Google Play, stored as public/icons/rijeka.png.
