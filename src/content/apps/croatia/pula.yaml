notes: >-
  The mapped service area is the official boundary of Pula, the city Pulapromet
  serves, so the shaded shape follows the municipal boundary rather than a
  stop-density approximation. The operator publishes the app as Mobility Plus,
  which sells QR singles for fare zones 1 to 3 alongside timetables and journey
  planning. The icon is the official Mobility Plus (Pulapromet) app icon from
  Google Play, stored as public/icons/pula.png.
