notes: >-
  The mapped service area is built from the position of the 11,760 SL bus stops,
  tram stops, metro and rail stations and ferry piers across Stockholm County, so
  the shaded area follows the network rather than the county line. The island
  piers carry the outline out through the archipelago to Sandhamn. The icon is
  the official SL app icon, stored as public/icons/sl.png.
