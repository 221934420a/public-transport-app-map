notes: >-
  The mapped service area is built from the position of the 1512 Jönköpings Länstrafik bus stops, tram stops, rail stations and ferry piers across Jönköping County (OSM, ISO 3166-2 SE-F), so the shaded area follows the network rather than the county line. The icon is the official Jönköpings Länstrafik app icon from Google Play, stored as public/icons/lanstrafiken-jonkoping.png.
