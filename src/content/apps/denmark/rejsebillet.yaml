notes: >-
  The app sells tickets and passes for every Danish fare area, so the mapped
  service area is the national boundary. Each City Pass type has its own
  coverage record built from the official DOT fare zone geometry
  (zones 1-4, 1-99, 101-199, 201-299 and their union 1-299), which is why one
  app carries several coverage records. The icon is the official Rejsebillet app
  icon, stored as public/icons/rejsebillet.png.
