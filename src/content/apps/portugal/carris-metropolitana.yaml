notes: >-
  The mapped service area is the official boundary of the Lisbon metropolitan
  area, the authority whose zone map sets the fares sold in the app, so the
  shaded shape follows the zone map rather than a stop-density approximation.
  The icon is the official Carris Metropolitana app icon from Google Play,
  stored as public/icons/carris-metropolitana.png. The app is information-first:
  tickets for these suburban buses are still bought on board with cash or
  contactless, not in the app.
