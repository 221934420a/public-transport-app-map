boundary_description: >-
  Built from the location of every TfL bus stop and Underground station, so the
  shaded area covers the network's full reach: Greater London plus the rail
  extensions beyond the boundary such as Epping, Brentwood, Chesham, Amersham
  and Slough. Bus and tram services run within Greater London; the rail network
  reaches a little further. Southeastern high-speed and Heathrow Express are not
  covered.
