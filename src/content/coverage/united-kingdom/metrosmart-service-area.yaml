boundary_description: >-
  Built from the location of every Merseyside bus stop and rail station (from
  NaPTAN), plus the rail-only extensions beyond Merseyside. Saveaway is valid for
  bus, rail and Mersey Ferries across Merseyside and is not valid in Halton. An
  All Areas Saveaway also allows rail-only travel to Ormskirk, Chester and
  Ellesmere Port.
