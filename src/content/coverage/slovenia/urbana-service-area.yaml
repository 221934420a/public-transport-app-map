boundary_description: >-
  The mapped service area is the official boundary of Ljubljana, the city LPP
  serves, so the shaded shape follows the municipal boundary rather than a
  stop-density approximation. Urbana stores value and passes and validates them
  over Bluetooth against the reader on board; there is no day ticket, since day
  travel is covered by the Ljubljana Card tourist product.
