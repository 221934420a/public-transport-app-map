validity_description: >-
  Unlimited travel with buses, trains, the metro and the harbour buses in zones
  1-99 for the period bought: the whole Greater Copenhagen area, including
  Copenhagen Airport, Roskilde and North Zealand up to Helsingør and Hundested.
  An adult travelling on a valid ticket can bring two children under 12 free,
  and children aged 12-15 pay half price. It does not cover the rest of Denmark.
