validity_description: >-
  Unlimited travel with buses, trains, the metro and the harbour buses in zones
  1-299 for 24 hours: Copenhagen, the whole of Zealand and the islands, including
  Roskilde, Helsingør, Køge, Næstved, Lolland, Falster and Møn. An adult
  travelling on a valid ticket can bring two children under 12 free, and children
  aged 12-15 pay half price. Sold in the Rejsebillet app only.
