validity_description: >-
  Unlimited travel with buses and trains in zones 101-199 for 24 hours: West
  Zealand, including Kalundborg, Holbæk, Slagelse, Sorø and Ringsted. It does not
  include Copenhagen or the Greater Copenhagen area. An adult travelling on a
  valid ticket can bring two children under 12 free, and children aged 12-15 pay
  half price. Sold in the Rejsebillet app only.
