validity_description: >-
  Unlimited travel with buses and trains in zones 201-299 for 24 hours: South
  Zealand plus Lolland, Falster and Møn, including Køge, Næstved, Vordingborg and
  Stevns. It does not include Copenhagen or the Greater Copenhagen area. An adult
  travelling on a valid ticket can bring two children under 12 free, and children
  aged 12-15 pay half price. Sold in the Rejsebillet app only.
