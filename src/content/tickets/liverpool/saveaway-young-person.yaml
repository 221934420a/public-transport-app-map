validity_description: >-
  Off-peak day ticket for anyone aged 5 to 18, for unlimited bus, rail and
  Mersey Ferries travel within the chosen Merseyside area, or across all areas.
  Valid after 09:30 Monday to Friday, and all day Saturday, Sunday and bank
  holidays. Not valid in Halton. Requires a £1 MetroCard.
